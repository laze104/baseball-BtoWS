<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>야구선수 키우기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>야구선수 키우기</h1>

  <!-- 화면 1: 선수 생성 -->
  <section id="create-screen">
    <h2>새 선수 만들기</h2>
    <form id="create-form">
      <label>이름
        <input id="name" type="text" maxlength="10" required placeholder="예: 김야구">
      </label>

      <label>유형
        <select id="type">
          <option value="batter">타자</option>
          <option value="pitcher">투수</option>
          <option value="twoway">이도류</option>
        </select>
      </label>

      <label>포지션
        <select id="position"></select>
      </label>

      <label>투타
        <select id="hand">
          <option>우투우타</option>
          <option>우투좌타</option>
          <option>좌투좌타</option>
          <option>좌투우타</option>
        </select>
      </label>

      <label class="school-field"><span>고등학교 <small id="school-count"></small></span>
        <input id="school-search" type="search" placeholder="학교 검색 (예: 덕수, 부산, 경기)">
        <select id="school"></select>
      </label>

      <label>플레이 스타일
        <select id="style"></select>
      </label>

      <label>등번호 <small>(0~99)</small>
        <input id="number" type="number" min="0" max="99" required>
      </label>

      <!-- 서포트 카드 (cards.js가 채움) -->
      <div id="deck-box"></div>

      <button type="submit">선수 생성</button>
    </form>
    <p id="version">v0.18</p>
  </section>

  <!-- 화면 2: 선수 정보와 시즌 진행 (처음엔 숨김) -->
  <section id="player-screen" hidden>
    <div id="player-header"></div>

    <!-- 진로 선택지 (드래프트 미지명, FA, 국가대표 등) -->
    <div id="choice-panel" hidden></div>

    <nav id="tabs">
      <button data-tab="train" class="active">훈련</button>
      <button data-tab="result">시즌 결과</button>
      <button data-tab="news">뉴스</button>
      <button data-tab="board">반응</button>
      <button data-tab="mail">메일</button>
      <button data-tab="records">기록</button>
      <button data-tab="nemesis">숙적</button>
      <button data-tab="locker">동료</button>
      <button data-tab="money">재산</button>
      <button data-tab="ach">업적</button>
    </nav>
    <!-- 기록 탭 누를 때만 보이는 하위 탭 -->
    <nav id="subtabs" hidden>
      <button data-tab="record">통산 기록</button>
      <button data-tab="almanac">연감</button>
      <button data-tab="rank">순위</button>
    </nav>

    <div class="tab" id="tab-train">
      <div id="player-card"></div>
      <div id="season-panel">
        <h3>이번 시즌 집중 훈련 <small>(2개 선택, 나머지는 떨어질 수도 있어요)</small></h3>
        <div id="focus-list"></div>
        <div id="position-panel"></div>
        <button id="season-button" disabled>시즌 진행</button>
        <button id="retire-button" class="secondary" hidden>은퇴하기</button>
      </div>
    </div>
    <div class="tab" id="tab-result" hidden></div>
    <div class="tab" id="tab-news" hidden></div>
    <div class="tab" id="tab-board" hidden></div>
    <div class="tab" id="tab-mail" hidden></div>
    <div class="tab" id="tab-record" hidden></div>
    <div class="tab" id="tab-almanac" hidden></div>
    <div class="tab" id="tab-nemesis" hidden></div>
    <div class="tab" id="tab-locker" hidden></div>
    <div class="tab" id="tab-rank" hidden></div>
    <div class="tab" id="tab-money" hidden></div>
    <div class="tab" id="tab-ach" hidden></div>

    <button id="reset-button" class="secondary">처음부터 다시</button>
  </section>

  <!-- 화면 3: 은퇴 -->
  <section id="retired-screen" hidden>
    <div id="retire-summary"></div>
    <div id="hof-result"></div>
    <h3>명예의 전당</h3>
    <div id="hof-hall"></div>
    <h3>역대 선수 랭킹 <small>(통산 WAR 순)</small></h3>
    <div id="ranking"></div>
    <h3>업적 도감</h3>
    <div id="ach-retired"></div>
    <button id="new-player-button">새 선수 키우기</button>
  </section>

  <!-- 큰 화면 알림 (수상, 결정적 순간 결과) -->
  <div id="big-modal" hidden>
    <div class="big-card">
      <p class="big-kicker"></p>
      <h2 class="big-title"></h2>
      <div class="big-body"></div>
      <button id="big-close">확인</button>
    </div>
  </div>

  <!-- 감독 면담 1대1 대화 -->
  <div id="talk-modal" hidden>
    <div class="talk-card">
      <div class="talk-head"></div>
      <div class="talk-log"></div>
      <div class="talk-options"></div>
    </div>
  </div>

  <!-- 작은 기록 알림 -->
  <div id="toasts"></div>

  <!-- 스크립트는 순서대로 읽힘 (모듈 안 씀, 함수는 전부 전역)
       core: 규칙·데이터 / media: 기사·댓글·중계 / systems: 콘텐츠 / flow: 시즌에 연결 / ui: 화면 -->
  <script src="js/core/util.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/sim.js"></script>
  <script src="js/core/legacy.js"></script>
  <script src="js/core/money.js"></script>
  <script src="js/core/rules.js"></script>
  <script src="js/core/career.js"></script>
  <script src="js/core/world.js"></script>
  <script src="js/core/extra.js"></script>

  <script src="js/media/feed.js"></script>
  <script src="js/media/news.js"></script>
  <script src="js/media/broadcast.js"></script>
  <script src="js/media/press.js"></script>
  <script src="js/media/saber.js"></script>
  <script src="js/media/almanac.js"></script>
  <script src="js/media/mail.js"></script>

  <script src="js/systems/national.js"></script>
  <script src="js/systems/story.js"></script>
  <script src="js/systems/boxscore.js"></script>
  <script src="js/systems/nemesis.js"></script>
  <script src="js/systems/agent.js"></script>
  <script src="js/systems/dilemma.js"></script>
  <script src="js/systems/body.js"></script>
  <script src="js/systems/locker.js"></script>
  <script src="js/systems/living.js"></script>
  <script src="js/systems/era.js"></script>
  <script src="js/systems/ceremony.js"></script>
  <script src="js/systems/cards.js"></script>
  <script src="js/systems/fanfare.js"></script>
  <script src="js/systems/fandom.js"></script>
  <script src="js/systems/meme.js"></script>
  <script src="js/systems/sns.js"></script>

  <script src="js/flow.js"></script>

  <script src="js/ui/effects.js"></script>
  <script src="js/ui/talk.js"></script>
  <script src="js/ui/main.js"></script>
</body>
</html>
